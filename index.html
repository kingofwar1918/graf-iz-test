<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Graf-iz Rhesi">
<title>Lernjournal Graf-iz: Rhesi</title>
<style>
:root{
  --bg:#f3f5f4; --karte:#ffffff; --text:#1b2a30; --gedaempft:#5a6a70;
  --akzent:#1f5f7f; --akzent-hell:#2e7fa6; --akzent-zart:#e3eef3; --rand:#d5dde0;
  --richtig:#1e7f4f; --falsch:#b3352c; --hinweis:#8a5a12; --schrift:#1a3a8a;
  --radius:14px; --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
     background:var(--bg);color:var(--text);font-size:17px;line-height:1.5}
.huelle{max-width:900px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.45rem;margin:.2em 0}
h2{font-size:1.15rem;margin:.2em 0 .5em}
h3{font-size:1rem;margin:.6em 0 .3em}
.karte{background:var(--karte);border:1px solid var(--rand);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.feldnr{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;
        background:var(--akzent);color:#fff;font-weight:700;font-size:.9rem;margin-right:8px;flex:none}
.kopf{display:flex;align-items:center}
button{font:inherit;min-height:var(--tap);padding:10px 16px;border-radius:10px;border:1px solid var(--rand);
       background:var(--karte);color:var(--text);cursor:pointer}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--akzent-hell);outline-offset:2px}
.primaer{background:var(--akzent);border-color:var(--akzent);color:#fff;font-weight:600}
.klein{min-height:40px;padding:6px 12px;font-size:.95rem}
.zeile{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gedaempft{color:var(--gedaempft);font-size:.92rem}
.verborgen{display:none !important}
input[type=text],input[type=date],textarea{font:inherit;min-height:var(--tap);padding:10px;border:1px solid var(--rand);
       border-radius:10px;width:100%;background:#fff;color:var(--text)}
textarea{resize:vertical}
.leiste{height:8px;background:var(--rand);border-radius:99px;overflow:hidden;margin:8px 0}
.leiste > i{display:block;height:100%;background:var(--akzent-hell)}
.uebersicht{display:grid;gap:12px}
.gz-karte{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.gz-karte .text{flex:1;min-width:220px}
.marke{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.85rem;background:var(--akzent-zart);color:var(--akzent)}
.marke.fertig{background:#e6f4ec;color:var(--richtig)}
.oben{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.status{font-size:.9rem;color:var(--gedaempft)}
.wahl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.wahl button{text-align:left;line-height:1.25}
.wahl button.aktiv{background:var(--akzent-zart);border-color:var(--akzent);font-weight:600}
.wahl b{color:var(--akzent);margin-right:6px}
.grafik{position:relative;width:100%;max-width:760px;margin:0 auto;container-type:inline-size;border:1px solid var(--rand);border-radius:8px;overflow:hidden;background:#fff}
.grafik img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.grafik textarea{position:absolute;min-height:0;padding:.3cqw .5cqw;border:2px solid transparent;border-radius:3px;
       background:rgba(255,255,255,.01);font-size:2.6cqw;line-height:1.12;text-align:center;resize:none;overflow:hidden;color:var(--schrift)}
.grafik textarea:focus{border-color:var(--akzent-hell);background:rgba(255,255,255,.9)}
.grafik textarea::placeholder{color:#8a96a0}
.mal-werkzeuge{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.mal-werkzeuge button.aktiv{background:var(--akzent-zart);border-color:var(--akzent);font-weight:600}
.farbe{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-2px;margin-right:6px}
canvas.mal{display:block;width:100%;max-width:760px;margin:0 auto;aspect-ratio:100/72;background:#fff;border:1px solid var(--rand);border-radius:8px;touch-action:none}
.stichwort{margin:10px 0;line-height:2.2}
.stichwort input{display:inline-block;width:auto;min-width:9em;max-width:100%;min-height:40px;padding:4px 8px;margin:0 2px;
       border:0;border-bottom:2px solid var(--akzent-hell);border-radius:6px 6px 0 0;background:#f5f9fb;color:var(--schrift)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:40px;padding:6px 12px;border-radius:99px;font-size:.95rem;background:#fff}
.chip.benutzt{background:#e6f4ec;border-color:var(--richtig);color:var(--richtig);font-weight:600}
.zaehler{margin-top:6px;font-weight:600}
.zaehler.ok{color:var(--richtig)}
.check{display:flex;gap:12px;align-items:flex-start;margin:8px 0;min-height:var(--tap);cursor:pointer}
.check input{width:26px;height:26px;margin-top:2px;flex:none;accent-color:var(--akzent)}
.hinweis{background:#fff7e8;border:1px solid #f0d9ae;border-radius:10px;padding:10px 12px;color:#5c3d0a;font-size:.95rem}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:600;color:var(--akzent)}
.dialog-hg{position:fixed;inset:0;background:rgba(20,28,38,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dialog{background:#fff;border-radius:var(--radius);padding:20px;max-width:460px;width:100%}
.dialog .zeile{margin-top:12px}
@media print{
  body{background:#fff;font-size:11pt}
  button,.nicht-drucken,.oben,.chips,.mal-werkzeuge{display:none !important}
  .karte{border:1px solid #999;break-inside:avoid;margin-bottom:8px}
  .huelle{max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="huelle">
  <main id="buehne"></main>
</div>

<script>
/* ========================================================================
   1. INHALT. Nur dieser Block wird angepasst, wenn sich Texte ändern.
   Pro Graf-iz: Titel, Stichworte (Lücken = drei oder mehr Unterstriche),
   Satzanfänge, Wortspeicher, Quellen und die Grafiken A bis C
   (bild = Name im Bildblock BILDER am Ende der Datei).
   ======================================================================== */
const DATEN = {

  ],
  "grafiz": [
    {
      "nr": 1,
      "lektion": "Lektion 1",

      "titel": "Der Rhein vor der Haustür",
      "grafiken": [

          "buchstabe": "A",
          "titel": "Lagekarte (Skizze)",
          "bild": "gz1_a"
        },
        {
          "buchstabe": "B",

        },
        {

      ],
      "stichworte": [

        "Im Rheintal leben über 300’000 Menschen. Sie müssen vor ____________ geschützt werden.",

      ],

        "Rhesi"
      ],
      "quellen": "AB 1 «Der Rhein vor der Haustür» mit Lagekarte; Präsentation Lektion 1;"
    },
    {
      "nr": 2,
      "lektion": "Lektion 2",
      "zeit": "ca. 10 Minuten",
      "titel": "Wem gehört das Rheinvorland? Der Fall Koblach",
      "grafiken": [
        {
          "buchstabe": "A",

          "bild": "gz2_a"

    },
    {

      "zeit": "ca. 10 Minuten",

      "grafiken": [

    {

        }
      ],
      "stichworte": [
        "Mein Fall (Fluss, Ort): ______________________",
        "Problem: ______________________",
        "Lösung «Raum statt Damm»: ______________________",

      ],
      "satzanfaenge": [

      ],

    }

};

/* ========================================================================
   2. SPEICHER. Nutzt localStorage, wenn vorhanden, sonst nur Arbeitsspeicher.
   ======================================================================== */
const SCHLUESSEL = "grafiz-rhesi-v1";
const Speicher = (() => {
  let vorhanden = false, ersatz = {};
  try {
    window.localStorage.setItem("__test__", "1");
    window.localStorage.removeItem("__test__");
    vorhanden = true;
  } catch (e) { vorhanden = false; }
  return {
    dauerhaft: vorhanden,
    lies(s, standard) {
      try {
        const roh = vorhanden ? window.localStorage.getItem(s) : ersatz[s];
        return roh == null ? standard : JSON.parse(roh);
      } catch (e) { return standard; }
    },
    schreib(s, wert) {
      try {
        const roh = JSON.stringify(wert);
        if (vorhanden) window.localStorage.setItem(s, roh); else ersatz[s] = roh;
        return true;
      } catch (e) { return false; }
    }
  };
})();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

/* ========================================================================
   3. HILFSMITTEL
   ======================================================================== */
const $ = (sel, w = document) => w.querySelector(sel);
const buehne = $("#buehne");

function el(tag, attribute = {}, ...kinder) {
  const k = document.createElement(tag);
  for (const [n, w] of Object.entries(attribute)) {
    if (w === null || w === undefined || w === false) continue;
    if (n === "class") k.className = w;
    else if (n === "value") k.value = w;
    else if (n === "checked") k.checked = !!w;
    else if (n.startsWith("on")) k.addEventListener(n.slice(2).toLowerCase(), w);
    else k.setAttribute(n, w === true ? "" : w);
  }
  for (const kind of kinder.flat()) {
    if (kind == null || kind === false) continue;
    k.append(kind instanceof Node ? kind : document.createTextNode(String(kind)));
  }
  return k;
}

/* Eigener Dialog statt confirm() und alert() */
function dialog(text, knoepfe) {
  const hg = el("div", { class: "dialog-hg nicht-drucken" });
  const zu = () => hg.remove();
  hg.append(el("div", { class: "dialog", role: "dialog" },
    typeof text === "string" ? el("p", {}, text) : text,
    el("div", { class: "zeile" }, knoepfe.map(k =>
      el("button", { class: k.primaer ? "primaer" : "", onclick: () => { zu(); if (k.tun) k.tun(); } }, k.text)))));
  document.body.append(hg);
}
function frage(text, beiJa, jaText = "Ja", neinText = "Abbrechen") {
  dialog(text, [{ text: jaText, primaer: true, tun: beiJa }, { text: neinText }]);
}
function meldung(text) { dialog(text, [{ text: "OK", primaer: true }]); }

const LUECKE = /_{3,}/;
function teileVorlage(vorlage) { return vorlage.split(LUECKE); }
function heuteISO() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function datumCH(iso) { if (!iso) return ""; const [j, m, t] = iso.split("-"); return `${t}.${m}.${j}`; }
function sauber(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9-]+/g, "-").replace(/^-+|-+$/g, ""); }

/* ========================================================================
   4. ZUSTAND
   ======================================================================== */
function leererEintrag(gz) {
  return {
    titel: gz.titel, datum: "", wahl: "",
    felder: {}, zeichnung: "",
    stichworte: gz.stichworte.map(s => teileVorlage(s).slice(1).map(() => "")),
    text: "", quellen: "", check: DATEN.checkliste.map(() => false), geaendert: 0
  };
}
let Journal = Speicher.lies(SCHLUESSEL, null);
if (!Journal || Journal.v !== 1) Journal = { v: 1, name: "", klasse: "", eintraege: {} };
function eintrag(nr) {
  const gz = DATEN.grafiz.find(g => g.nr === nr);
  if (!Journal.eintraege[nr]) Journal.eintraege[nr] = leererEintrag(gz);
  return Journal.eintraege[nr];
}

let speicherTimer = null;
function speichern(sofort = false) {
  clearTimeout(speicherTimer);
  const tun = () => {
    speicherTimer = null;
    const ok = Speicher.schreib(SCHLUESSEL, Journal);
    const st = $("#status");
    if (st) st.textContent = ok ? (Speicher.dauerhaft ? "Gespeichert ✓" : "Nicht dauerhaft gespeichert") : "Speichern fehlgeschlagen";
    if (!ok && !speichern.gewarnt) { speichern.gewarnt = true; meldung("Der Speicher auf diesem Gerät ist voll. Speichere jetzt eine Sicherung oder dein Word."); }
  };
  if (sofort) tun(); else { const st = $("#status"); if (st) st.textContent = "…"; speicherTimer = setTimeout(tun, 400); }
}
function geaendert(nr) { eintrag(nr).geaendert = Date.now(); speichern(); }

const Ansicht = { bildschirm: "start", nr: 1 };
function zeige(bildschirm, nr) {
  Ansicht.bildschirm = bildschirm; if (nr) Ansicht.nr = nr;
  buehne.replaceChildren();
  ({ start: startBild, grafiz: grafizBild }[bildschirm])();
  window.scrollTo(0, 0);
}

/* Fortschritt: Grafik, Stichworte, Fliesstext, Checkliste */
function wortspeicherTreffer(gz, text) {
  const t = (text || "").toLowerCase();
  return gz.wortspeicher.filter(w => t.includes(w.toLowerCase()));
}
function teile(gz, e) {
  if (!e) return [false, false, false, false];
  const grafik = e.wahl === "D" ? !!e.zeichnung : !!(e.wahl && (e.felder[e.wahl] || []).some(f => f && f.trim()));
  const stich = e.stichworte.every(z => z.every(f => f && f.trim()));
  const text = (e.text || "").trim().length >= 80 && wortspeicherTreffer(gz, e.text).length >= 3;
  const check = e.check.every(Boolean);
  return [grafik, stich, text, check];
}

/* ========================================================================
   5. BILDSCHIRME
   ======================================================================== */
function startBild() {
  document.title = DATEN.titel;
  const nameFeld = el("input", { type: "text", value: Journal.name, placeholder: "Vorname oder Fantasiename",
    autocomplete: "off", oninput: e => { Journal.name = e.target.value; speichern(); } });
  const klasseFeld = el("input", { type: "text", value: Journal.klasse, placeholder: "z.B. 2a",
    autocomplete: "off", oninput: e => { Journal.klasse = e.target.value; speichern(); } });

  buehne.append(
    el("header", {}, el("h1", {}, DATEN.titel), el("p", { class: "gedaempft" }, DATEN.untertitel)),
    el("div", { class: "karte" },
      el("div", { class: "zeile" },
        el("label", { style: "flex:2;min-width:200px" }, el("span", { class: "gedaempft" }, "Name"), nameFeld),
        el("label", { style: "flex:1;min-width:120px" }, el("span", { class: "gedaempft" }, "Klasse"), klasseFeld)),
      el("p", { class: "gedaempft", style: "margin-bottom:0" }, "Ein Vorname oder ein Fantasiename genügt.")),
    Speicher.dauerhaft ? null : el("p", { class: "hinweis" },
      "Achtung: In dieser Ansicht wird nichts dauerhaft gespeichert. Speichere am Schluss dein Word."),
    el("div", { class: "uebersicht" }, DATEN.grafiz.map(gz => {
      const e = Journal.eintraege[gz.nr];
      const t = teile(gz, e), n = t.filter(Boolean).length;
      return el("div", { class: "karte gz-karte" },
        el("div", { class: "text" },
          el("div", { class: "gedaempft" }, `Graf-iz ${gz.nr} · ${gz.lektion}`),
          el("h2", { style: "margin:.1em 0" }, gz.titel),
          el("span", { class: "marke" + (n === 4 ? " fertig" : "") },
            !e ? "noch leer" : n === 4 ? "fertig ✓" : `${n} von 4 Teilen erledigt`),
          el("div", { class: "leiste" }, el("i", { style: `width:${n * 25}%` }))),
        el("button", { class: "primaer", onclick: () => zeige("grafiz", gz.nr) }, e ? "Weiterarbeiten" : "Beginnen"));
    })),
    el("div", { class: "karte" },
      el("h2", {}, "Abgeben und sichern"),
      el("p", {}, "Wenn du fertig bist: Erstelle dein Lernjournal als Word und schicke es deiner Lehrperson."),
      el("div", { class: "zeile" },

function einfuegen(feld, wort, neuerSatz = false) {
  const a = feld.selectionStart ?? feld.value.length, b = feld.selectionEnd ?? feld.value.length;
  const vor = feld.value.slice(0, a), nach = feld.value.slice(b);
  let teil = wort;
  if (neuerSatz) { if (vor.trim() && !/[\s]$/.test(vor)) teil = " " + teil; }
  else { if (vor && !/[\s(«]$/.test(vor)) teil = " " + teil; if (!nach || !/^[\s.,;:!?»)]/.test(nach)) teil = teil + " "; }
  feld.value = vor + teil + nach;
  const pos = (vor + teil).length;
  feld.focus(); feld.setSelectionRange(pos, pos);
  feld.dispatchEvent(new Event("input"));
}

/* Eigene Zeichnung (Finger oder Stift) */
function zeichenFlaeche(e, nr) {
  const B = 1000, H = 720;
  const c = el("canvas", { class: "mal", width: B, height: H, "aria-label": "Zeichenfläche" });
  const ctx = c.getContext("2d");
  const verlauf = [];
  let farbe = "#1b2a30", dicke = 4, radieren = false, aktiv = false, letzter = null;
  const weiss = () => { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, B, H); };
  weiss();
  if (e.zeichnung) { const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0, B, H); i.src = e.zeichnung; }
  const punkt = ev => { const r = c.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width * B, (ev.clientY - r.top) / r.height * H]; };
  const sichern = () => { e.zeichnung = c.toDataURL("image/png"); geaendert(nr); };
  c.addEventListener("pointerdown", ev => {
    ev.preventDefault(); c.setPointerCapture(ev.pointerId); aktiv = true; letzter = punkt(ev);
    verlauf.push(ctx.getImageData(0, 0, B, H)); if (verlauf.length > 12) verlauf.shift();
    ctx.beginPath(); ctx.arc(letzter[0], letzter[1], (radieren ? 18 : dicke) / 2, 0, Math.PI * 2);
    ctx.fillStyle = radieren ? "#fff" : farbe; ctx.fill();
  });
  c.addEventListener("pointermove", ev => {
    if (!aktiv) return; ev.preventDefault();
    const p = punkt(ev);
    ctx.strokeStyle = radieren ? "#fff" : farbe; ctx.lineWidth = radieren ? 18 : dicke; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(letzter[0], letzter[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); letzter = p;
  });
  const ende = () => { if (aktiv) { aktiv = false; sichern(); } };
  c.addEventListener("pointerup", ende); c.addEventListener("pointercancel", ende); c.addEventListener("pointerleave", ende);

  const werkzeuge = [];
  const wkz = (text, tun, farbPunkt) => {
    const b = el("button", { class: "klein", onclick: () => { tun(); werkzeuge.forEach(w => w.classList.remove("aktiv")); if (farbPunkt !== null) b.classList.add("aktiv"); } },
      farbPunkt ? el("span", { class: "farbe", style: `background:${farbPunkt}` }) : null, text);
    if (farbPunkt !== null) werkzeuge.push(b);
    return b;
  };
  const stift = wkz("Schwarz", () => { farbe = "#1b2a30"; radieren = false; }, "#1b2a30");
  stift.classList.add("aktiv");
  return el("div", {},
    el("div", { class: "mal-werkzeuge" },
      stift,
      wkz("Blau", () => { farbe = "#1f5f9f"; radieren = false; }, "#1f5f9f"),
      wkz("Rot", () => { farbe = "#b3352c"; radieren = false; }, "#b3352c"),
      wkz("Radierer", () => { radieren = true; }, "#ffffff"),
      el("button", { class: "klein", onclick: () => { dicke = dicke === 4 ? 9 : 4; } }, "Dünn / Dick"),
      el("button", { class: "klein", onclick: () => { const s = verlauf.pop(); if (s) { ctx.putImageData(s, 0, 0); sichern(); } } }, "Rückgängig"),
      el("button", { class: "klein", onclick: () => frage("Die ganze Zeichnung löschen?", () => { verlauf.push(ctx.getImageData(0, 0, B, H)); weiss(); sichern(); }, "Löschen") }, "Alles löschen")),
    c,
    el("p", { class: "gedaempft" }, "Zeichne mit dem Finger oder dem Stift. Beschrifte deine Grafik mit mindestens drei Fachbegriffen."));
}

   6. SICHERUNG (JSON) UND AUSGABE

function dateiAnbieten(blob, name, erklaerung) {
  const datei = (() => { try { return new File([blob], name, { type: blob.type }); } catch (e) { return null; } })();
  const teilen = datei && navigator.canShare && navigator.canShare({ files: [datei] });
  const herunterladen = () => {
    const url = URL.createObjectURL(blob);
    const a = el("a", { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };
  const knoepfe = [];
  if (teilen) knoepfe.push({ text: "Teilen (Mail, Teams …)", primaer: true,
    tun: () => navigator.share({ files: [datei], title: name }).catch(() => {}) });
  knoepfe.push({ text: "Auf dem Gerät speichern", primaer: !teilen, tun: herunterladen });
  knoepfe.push({ text: "Schliessen" });
  dialog(el("div", {}, el("p", { style: "margin-top:0" }, el("strong", {}, name)), el("p", {}, erklaerung)), knoepfe);
}

function sicherungSpeichern() {

function sicherungLaden() {

/* ---------- Grafik mit eingetragenem Text als Bild zusammensetzen ---------- */
function bildLaden(src) { return new Promise((ok, nein) => { const i = new Image(); i.onload = () => ok(i); i.onerror = nein; i.src = src; }); }

function umbrechen(ctx, text, breite) {
  const zeilen = [];
  for (const absatz of String(text).split(/\n/)) {
    let zeile = "";
    for (const wort of absatz.split(/\s+/).filter(Boolean)) {
      const probe = zeile ? zeile + " " + wort : wort;
      if (ctx.measureText(probe).width <= breite || !zeile) zeile = probe; else { zeilen.push(zeile); zeile = wort; }
    }
    zeilen.push(zeile);
  }
  return zeilen;
}

async function grafikBild(gz, e) {
  if (e.wahl === "D") return e.zeichnung || null;
  const g = gz.grafiken.find(x => x.buchstabe === e.wahl);
  if (!g) return null;
  const bild = BILDER[g.bild];
  const img = await bildLaden(bild.bild);
  const B = 1000, H = 720, s = B / 100;
  const c = document.createElement("canvas"); c.width = B; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, B, H); ctx.drawImage(img, 0, 0, B, H);
  const werte = e.felder[e.wahl] || [];
  bild.felder.forEach((f, i) => {
    const t = (werte[i] || "").trim(); if (!t) return;
    const x = f.x * s, y = (72 - f.y - f.h) * s, w = f.w * s, h = f.h * s;
    let gr = Math.min(28, h * 0.42), zeilen;
    for (; gr >= 11; gr -= 1) {
      ctx.font = `${gr}px Arial, sans-serif`;
      zeilen = umbrechen(ctx, t, w - 10);
      if (zeilen.length * gr * 1.15 <= h - 6 && zeilen.every(z => ctx.measureText(z).width <= w - 6)) break;
    }
    ctx.fillStyle = "#fff"; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    ctx.fillStyle = "#1a3a8a"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const start = y + h / 2 - (zeilen.length - 1) * gr * 1.15 / 2;
    zeilen.forEach((z, k) => ctx.fillText(z, x + w / 2, start + k * gr * 1.15, w - 6));
  });
  return c.toDataURL("image/png");
}

function textMitMarkierung(gz, text) {
  const treffer = wortspeicherTreffer(gz, text).sort((a, b) => b.length - a.length);
  if (!treffer.length) return lauf(text);
  const muster = new RegExp("(" + treffer.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return String(text).split(muster).map((t, i) => t ? lauf(t, { u: i % 2 === 1 }) : "").join("");
}

async function wordErstellen(nummern) {
  speichern(true);
  const liste = (nummern || DATEN.grafiz.map(g => g.nr).filter(n => Journal.eintraege[n]))
    .map(n => DATEN.grafiz.find(g => g.nr === n));
  if (!liste.length) { meldung("Es gibt noch kein Graf-iz zum Exportieren. Beginne zuerst mit Graf-iz 1."); return; }
  dialog("Dein Word wird erstellt …", []);
  try {
    const bilder = [], teile = [];
    const kopfZeile = `${Journal.name || "Name: ________"}${Journal.klasse ? " · Klasse " + Journal.klasse : ""}`;
    teile.push(absatzX(lauf(DATEN.titel, { b: true, sz: 36 }), { nach: 60 }));
    teile.push(absatzX(lauf(`${kopfZeile} · erstellt am ${datumCH(heuteISO())}`, { farbe: "595959" }), { nach: 240 }));
    for (const [k, gz] of liste.entries()) {
      const e = eintrag(gz.nr);
      const g = optionWahl(gz, e.wahl);
      teile.push(absatzX(lauf(`Graf-iz ${gz.nr}: ${e.titel || gz.titel}`, { b: true, sz: 30 }), { umbruchDavor: k > 0, vor: k ? 0 : 120, nach: 60 }));
      teile.push(absatzX(lauf(`${gz.lektion} · Datum: ${datumCH(e.datum) || "-"} · Grafik: ${g}`, { farbe: "595959", sz: 20 }), { nach: 160 }));
      teile.push(absatzX(lauf("Grafik", { b: true, farbe: "1F5F7F" }), { vor: 60, nach: 60 }));
      const uri = await grafikBild(gz, e);
      if (uri) {
        const nrB = bilder.length + 1; bilder.push(datenAusUri(uri));
        teile.push(absatzX(bildX("rIdBild" + nrB, nrB, 4680000, 3369600), { mitte: true, nach: 160 }));
      } else teile.push(absatzX(lauf("(noch keine Grafik)", { i: true, farbe: "808080" })));
      teile.push(absatzX(lauf("Stichworte", { b: true, farbe: "1F5F7F" }), { vor: 120, nach: 60 }));
      gz.stichworte.forEach((s, i) => {
        const st = teileVorlage(s); let inhalt = lauf("- ");
        st.forEach((t, j) => { inhalt += lauf(t); if (j < st.length - 1) { const w = (e.stichworte[i][j] || "").trim(); inhalt += w ? lauf(w, { b: true, farbe: "1A3A8A" }) : lauf("________"); } });
        teile.push(absatzX(inhalt, { einzug: 227, nach: 60 }));
      });
      teile.push(absatzX(lauf("Fliesstext", { b: true, farbe: "1F5F7F" }), { vor: 180, nach: 60 }));
      teile.push(absatzX((e.text || "").trim() ? textMitMarkierung(gz, e.text.trim()) : lauf("(noch kein Text)", { i: true, farbe: "808080" }), { nach: 60 }));
      const tr = wortspeicherTreffer(gz, e.text);
      teile.push(absatzX(lauf(`Wörter aus dem Wortspeicher (unterstrichen): ${tr.length}${tr.length ? " (" + tr.join(", ") + ")" : ""}`, { sz: 18, farbe: "595959" }), { nach: 120 }));
      teile.push(absatzX(lauf("Quellen", { b: true, farbe: "1F5F7F" }), { vor: 120, nach: 60 }));
      teile.push(absatzX(lauf(gz.quellen.replace(/;\s*$/, "") + (e.quellen && e.quellen.trim() ? "; " + e.quellen.trim() : "")), { nach: 120 }));
      teile.push(absatzX(lauf("Checkliste", { b: true, farbe: "1F5F7F" }), { vor: 120, nach: 60 }));
      DATEN.checkliste.forEach((c, i) => teile.push(absatzX(lauf((e.check[i] ? "☑ " : "☐ ") + c, { sz: 20 }), { nach: 20 })));
    }
    const sect = '<w:sectPr><w:footerReference w:type="default" r:id="rIdFuss"/><w:pgSz w:w="11906" w:h="16838"/>' +
      '<w:pgMar w:top="1276" w:right="851" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr>';
    const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
      'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
      'xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
    const dokument = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${teile.join("")}${sect}</w:body></w:document>`;
    const fuss = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr ${NS}><w:p><w:pPr><w:tabs><w:tab w:val="right" w:pos="9921"/></w:tabs></w:pPr>` +
      lauf(`Lernjournal Graf-iz · ${kopfZeile}\tSeite `, { sz: 16, farbe: "595959" }).replace(/\t/, "</w:t></w:r><w:r><w:rPr><w:color w:val=\"595959\"/><w:sz w:val=\"16\"/></w:rPr><w:tab/></w:r><w:r><w:rPr><w:color w:val=\"595959\"/><w:sz w:val=\"16\"/></w:rPr><w:t xml:space=\"preserve\">") +
      '<w:r><w:rPr><w:color w:val="595959"/><w:sz w:val="16"/></w:rPr><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:rPr><w:color w:val="595959"/><w:sz w:val="16"/></w:rPr><w:instrText xml:space="preserve"> PAGE </w:instrText></w:r>' +
      '<w:r><w:rPr><w:color w:val="595959"/><w:sz w:val="16"/></w:rPr><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:rPr><w:color w:val="595959"/><w:sz w:val="16"/></w:rPr><w:t>1</w:t></w:r><w:r><w:rPr><w:color w:val="595959"/><w:sz w:val="16"/></w:rPr><w:fldChar w:fldCharType="end"/></w:r></w:p></w:ftr>';
    const stile = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
      '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Arial" w:cs="Arial"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="de-CH"/></w:rPr></w:rPrDefault>' +
      '<w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>' +
      '<w:style w:type="paragraph" w:default="1" w:styleId="Standard"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>';
    const rels = ['<Relationship Id="rIdStile" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>',
      '<Relationship Id="rIdFuss" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>']
      .concat(bilder.map((_, i) => `<Relationship Id="rIdBild${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/grafik${i + 1}.png"/>`));
    const dateien = [
      { name: "[Content_Types].xml", daten: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/>' +
        '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
        '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
        '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>' },
      { name: "_rels/.rels", daten: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>' },
      { name: "word/document.xml", daten: dokument },
      { name: "word/styles.xml", daten: stile },
      { name: "word/footer1.xml", daten: fuss },
      { name: "word/_rels/document.xml.rels", daten: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + rels.join("") + "</Relationships>" }
    ].concat(bilder.map((d, i) => ({ name: `word/media/grafik${i + 1}.png`, daten: d })));
    const blob = zipErstellen(dateien);
    document.querySelectorAll(".dialog-hg").forEach(d => d.remove());
    const teilName = liste.length === 1 ? `Graf-iz-${liste[0].nr}` : "Graf-iz";
    dateiAnbieten(blob, `Lernjournal_${teilName}_${sauber(Journal.name) || "Rhesi"}_${heuteISO()}.docx`,
      "Teile das Word direkt mit deiner Lehrperson (z.B. per Mail oder Teams) oder speichere es in deinen Dateien und schicke es dann.");
  } catch (err) {
    console.error(err);
    document.querySelectorAll(".dialog-hg").forEach(d => d.remove());
    meldung("Das Word konnte nicht erstellt werden. Speichere eine Sicherung und versuche es nochmals.");
  }
}
function optionWahl(gz, w) {
  if (w === "D") return "D Eigene Zeichnung";
  const g = gz.grafiken.find(x => x.buchstabe === w);
  return g ? `${g.buchstabe} ${g.titel}` : "-";
}
